<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>源润酒店食品 - 菜品管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }

        .add-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: none;
        }

        .add-form.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #f5576c;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .dish-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .dish-price {
            font-size: 1.5em;
            color: #f5576c;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .dish-price:hover {
            color: #667eea;
            transform: scale(1.05);
        }

        .dish-price::before {
            content: '¥';
            font-size: 0.8em;
        }

        .edit-input {
            width: 100px;
            padding: 5px 10px;
            border: 2px solid #667eea;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight: bold;
            color: #f5576c;
            outline: none;
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            transition: all 0.3s;
            opacity: 0;
        }

        .menu-card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: #ff3344;
            transform: scale(1.1);
        }

        .edit-btn {
            position: absolute;
            top: 10px;
            right: 50px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            transition: all 0.3s;
            opacity: 0;
        }

        .menu-card:hover .edit-btn {
            opacity: 1;
        }

        .edit-btn:hover {
            background: #5568d3;
            transform: scale(1.1);
        }

        .no-result {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 1.2em;
        }

        .toggle-form-btn {
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍽️ 源润酒店食品</h1>
            <p>专业菜品管理系统</p>
        </div>

        <div class="content">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalDishes">0</div>
                    <div class="stat-label">菜品总数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgPrice">0</div>
                    <div class="stat-label">平均价格</div>
                </div>
            </div>

            <div class="search-section">
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="输入菜名搜索价格...">
                    <button class="btn btn-primary" onclick="searchDish()">搜索</button>
                </div>

                <button class="btn btn-success toggle-form-btn" onclick="toggleAddForm()">+ 添加新菜品</button>

                <div class="add-form" id="addForm">
                    <h3 style="margin-bottom: 20px; color: #333;">添加新菜品</h3>
                    <div class="form-group">
                        <label for="newDishName">菜品名称：</label>
                        <input type="text" id="newDishName" placeholder="请输入菜品名称">
                    </div>
                    <div class="form-group">
                        <label for="newDishPrice">价格（元）：</label>
                        <input type="number" id="newDishPrice" placeholder="请输入价格" step="0.1">
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-success" onclick="addDish()">保存</button>
                        <button class="btn" style="background: #ccc; color: #333;" onclick="toggleAddForm()">取消</button>
                    </div>
                </div>
            </div>

            <div id="menuContainer">
                <div class="menu-grid" id="menuGrid"></div>
            </div>
        </div>
    </div>

    <script>
        let dishes = [
            { name: "白玉耳", price: 5.8 },
            { name: "北极裙边", price: 9.5 },
            { name: "翡翠馋香丝", price: 4 },
            { name: "山药车厘子", price: 12.5 },
            { name: "250克牛耳", price: 9 },
            { name: "一品翡翠", price: 4.5 },
            { name: "墨鱼子", price: 33 },
            { name: "大叶扫帚苗", price: 4 },
            { name: "10片带鱼段", price: 14 },
            { name: "鲜腐竹", price: 5 },
            { name: "10斤功夫探虾40/50的", price: 270 },
            { name: "厚海螺片", price: 13.5 },
            { name: "核桃菌", price: 9.5 },
            { name: "五香黑豆丝", price: 4 },
            { name: "黑腐竹", price: 8 },
            { name: "黑椒香芋盒", price: 7 },
            { name: "锦绣虾球", price: 10.5 },
            { name: "黑鱼片", price: 9.8 },
            { name: "红豆山药", price: 5.8 },
            { name: "蛰头", price: 9 },
            { name: "花甲", price: 0 },
            { name: "黄金沙律鱼排", price: 10.5 },
            { name: "枸杞凉糕", price: 7.5 },
            { name: "黄鱼籽", price: 8 },
            { name: "鸡汁豆丝", price: 5.8 },
            { name: "藤椒鸡", price: 36 },
            { name: "呀2.2斤椒麻土鸡", price: 33 },
            { name: "盐香土鸡", price: 31 },
            { name: "2.2斤盐焗鸡", price: 34 },
            { name: "金牌花胶", price: 18 },
            { name: "金玉满堂", price: 5.8 },
            { name: "500克鱼肚", price: 24 },
            { name: "麻辣钉螺", price: 9 },
            { name: "麻辣花螺", price: 13.5 },
            { name: "麻辣蟹钳", price: 13.5 },
            { name: "南极磷虾卷", price: 9 },
            { name: "楚玉虾尾", price: 118 },
            { name: "玛咖菌", price: 4 },
            { name: "叶牡丹苗", price: 3 },
            { name: "牛板筋", price: 14 },
            { name: "牛子粒", price: 13.5 },
            { name: "牛肉片", price: 22.5 },
            { name: "糯米红豆丸", price: 7 },
            { name: "清水莴笋", price: 6.8 },
            { name: "牛肚丝", price: 14 },
            { name: "干锅五菌", price: 0 },
            { name: "山药魔方", price: 10 },
            { name: "烧烤黄鱼1.65一条", price: 0 },
            { name: "烧烤小班鱼1.1一条", price: 0 },
            { name: "手撕馋嘴皮", price: 4 },
            { name: "香卤油豆皮", price: 4 },
            { name: "功夫鱿鱼笋", price: 13.5 },
            { name: "核桃仁", price: 6 },
            { name: "藤椒鸭", price: 17 },
            { name: "豌豆红", price: 4.5 },
            { name: "鲜香好黄鱼", price: 26 },
            { name: "香芒椰子糕", price: 5.2 },
            { name: "小炒黄牛肉", price: 14 },
            { name: "4/6莱克小龙虾", price: 18 },
            { name: "精品笋丝", price: 5.5 },
            { name: "极品红虾16/20的", price: 580 },
            { name: "极品红虾21/25的", price: 560 },
            { name: "鱼皮卷", price: 5.5 },
            { name: "原味鱼皮丝", price: 8 },
            { name: "御品鲍丝", price: 12.5 },
            { name: "鸳鸯鲍螺片", price: 13 },
            { name: "原味芥丝", price: 8.5 },
            { name: "芝麻藕条", price: 7.2 },
            { name: "竹耳", price: 6.8 },
            { name: "顶级海蜇丝", price: 9.5 },
            { name: "不带壳海螺片", price: 10.5 },
            { name: "裹粉的展翅黄鱼籽", price: 9 }
        ];

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('yuanrun_dishes');
            if (saved) {
                dishes = JSON.parse(saved);
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('yuanrun_dishes', JSON.stringify(dishes));
        }

        function renderDishes(dishList = dishes) {
            const grid = document.getElementById('menuGrid');
            
            if (dishList.length === 0) {
                grid.innerHTML = '<div class="no-result">没有找到相关菜品</div>';
                return;
            }

            grid.innerHTML = dishList.map((dish, index) => `
                <div class="menu-card">
                    <button class="edit-btn" onclick="editPrice(${index})" title="修改价格">✏️</button>
                    <button class="delete-btn" onclick="deleteDish(${index})" title="删除">×</button>
                    <div class="dish-name">${dish.name}</div>
                    <div class="dish-price" id="price-${index}" onclick="editPrice(${index})">${dish.price > 0 ? dish.price.toFixed(1) : '面议'}</div>
                </div>
            `).join('');

            updateStats();
        }

        function updateStats() {
            document.getElementById('totalDishes').textContent = dishes.length;
            const avgPrice = dishes.filter(d => d.price > 0).reduce((sum, d) => sum + d.price, 0) / dishes.filter(d => d.price > 0).length;
            document.getElementById('avgPrice').textContent = avgPrice > 0 ? avgPrice.toFixed(1) : '0';
        }

        function searchDish() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            
            if (!keyword) {
                renderDishes(dishes);
                return;
            }

            const filtered = dishes.filter(dish => 
                dish.name.toLowerCase().includes(keyword)
            );

            renderDishes(filtered);
        }

        function toggleAddForm() {
            const form = document.getElementById('addForm');
            form.classList.toggle('active');
        }

        function addDish() {
            const name = document.getElementById('newDishName').value.trim();
            const price = parseFloat(document.getElementById('newDishPrice').value);

            if (!name) {
                alert('请输入菜品名称！');
                return;
            }

            if (isNaN(price) || price < 0) {
                alert('请输入有效的价格！');
                return;
            }

            dishes.push({ name, price });
            saveToLocalStorage();
            renderDishes();

            document.getElementById('newDishName').value = '';
            document.getElementById('newDishPrice').value = '';
            toggleAddForm();

            alert('菜品添加成功！');
        }

        function deleteDish(index) {
            if (confirm('确定要删除这个菜品吗？')) {
                dishes.splice(index, 1);
                saveToLocalStorage();
                renderDishes();
            }
        }

        function editPrice(index) {
            const priceElement = document.getElementById(`price-${index}`);
            const currentPrice = dishes[index].price;
            
            priceElement.innerHTML = `<input type="number" class="edit-input" id="edit-input-${index}" value="${currentPrice}" step="0.1" onblur="savePrice(${index})" onkeypress="handlePriceKeypress(event, ${index})">`;
            
            const input = document.getElementById(`edit-input-${index}`);
            input.focus();
            input.select();
        }

        function savePrice(index) {
            const input = document.getElementById(`edit-input-${index}`);
            const newPrice = parseFloat(input.value);

            if (isNaN(newPrice) || newPrice < 0) {
                alert('请输入有效的价格！');
                renderDishes();
                return;
            }

            dishes[index].price = newPrice;
            saveToLocalStorage();
            renderDishes();
        }

        function handlePriceKeypress(event, index) {
            if (event.key === 'Enter') {
                savePrice(index);
            } else if (event.key === 'Escape') {
                renderDishes();
            }
        }

        document.getElementById('searchInput').addEventListener('input', searchDish);

        document.getElementById('newDishPrice').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addDish();
            }
        });

        window.onload = function() {
            loadFromLocalStorage();
            renderDishes();
        };
    </script>
</body>
</html>
