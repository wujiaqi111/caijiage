<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜品价格查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .search-box {
            position: relative;
            margin-bottom: 30px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 20px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .results {
            max-height: 500px;
            overflow-y: auto;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .dish-name {
            font-size: 18px;
            color: #333;
            font-weight: 500;
        }

        .dish-price {
            font-size: 20px;
            color: #667eea;
            font-weight: bold;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        .stats {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>

        <div class="search-box">

                type="text"

                placeholder="输入菜名进行搜索..."

            { name: "竹耳", price: 6.8 },
            { name: "顶级海蜇丝", price: 9.5 }
        ];

        const searchInput = document.getElementById('searchInput');
        const resultsDiv = document.getElementById('results');
        const statsDiv = document.getElementById('stats');

        function displayResults(items) {
            if (items.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">未找到匹配的菜品 😕</div>';
                statsDiv.textContent = `共 ${menuData.length} 道菜品`;
                return;
            }

            const html = items.map(item => `
                <div class="result-item">
                    <span class="dish-name">${item.name}</span>
                    <span class="dish-price">${item.price !== null ? '¥' + item.price : '价格待定'}</span>
                </div>
            `).join('');

            resultsDiv.innerHTML = html;
            statsDiv.textContent = `找到 ${items.length} 个结果 / 共 ${menuData.length} 道菜品`;
        }

        function searchDishes(query) {
            if (!query.trim()) {
                displayResults(menuData);
                return;
            }

            const filtered = menuData.filter(item => 
                item.name.toLowerCase().includes(query.toLowerCase())
            );

            displayResults(filtered);
        }

        searchInput.addEventListener('input', (e) => {
            searchDishes(e.target.value);
        });

        // 初始化显示所有菜品
        displayResults(menuData);

        // 自动聚焦搜索框
        searchInput.focus();
    </script>
</body>
